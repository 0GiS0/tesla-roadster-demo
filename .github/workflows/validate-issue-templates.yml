name: 📋 Validate issue templates

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/validate-issue-templates.yml"
  push:
    branches: [main]
    paths:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/validate-issue-templates.yml"

permissions:
  contents: read

concurrency:
  group: validate-issue-templates-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-jsonschema:
    name: 🧾 Check issue template schemas
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: 🐍 Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: 📦 Install check-jsonschema
        run: python -m pip install "check-jsonschema==0.39.0"

      - name: ✅ Validate issue form templates
        run: |
          shopt -s nullglob
          forms=()
          for file in .github/ISSUE_TEMPLATE/*.yml .github/ISSUE_TEMPLATE/*.yaml; do
            if [ "$(basename "$file")" != "config.yml" ]; then
              forms+=("$file")
            fi
          done

          if [ "${#forms[@]}" -eq 0 ]; then
            echo "No issue form templates found; skipping."
            exit 0
          fi

          check-jsonschema --builtin-schema vendor.github-issue-forms "${forms[@]}"

      - name: ⚙️ Validate issue template config
        run: |
          if [ ! -f .github/ISSUE_TEMPLATE/config.yml ]; then
            echo "No issue template config.yml found; skipping."
            exit 0
          fi

          check-jsonschema --builtin-schema vendor.github-issue-config .github/ISSUE_TEMPLATE/config.yml
