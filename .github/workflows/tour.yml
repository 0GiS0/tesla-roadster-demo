name: 🎬 README tour
on:
  workflow_run:
    workflows: ["🚀 Validate and deploy Pages"]
    types: [completed]
    branches: [main]
  # Reconciliation: a deploy that finished while a tour PR was open is skipped, so a daily run catches up.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: readme-tour
  cancel-in-progress: false
jobs:
  tour:
    name: 🎬 tour
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PR_TITLE: 'docs: update the README tour video'
    steps:
      # Docs-only pushes skip the deploy job, so a successful run is not enough.
      - name: 🌐 Check that the deploy job succeeded
        id: deploy
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != workflow_run ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          conclusion=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "🌐 deploy") | .conclusion')
          echo "Deploy job conclusion: ${conclusion:-<not found>}"
          if [ "$conclusion" = success ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 🔎 Look for an open tour pull request
        id: open_pr
        if: steps.deploy.outputs.deployed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "🌙 lights-out" \
            --search "in:title \"$PR_TITLE\"" --json number --jq 'length')
          echo "open=$open" >> "$GITHUB_OUTPUT"
      - name: 📥 Check out the deployed commit
        if: steps.deploy.outputs.deployed == 'true' && steps.open_pr.outputs.open == '0'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: "#️⃣ Hash the tour inputs"
        id: hash
        if: steps.deploy.outputs.deployed == 'true' && steps.open_pr.outputs.open == '0'
        shell: bash
        run: |
          set -euo pipefail
          # The encoding is not deterministic, so only the inputs decide whether to re-record.
          hash=$(git ls-files -z src public index.html vite.config.ts scripts/record-tour.mjs scripts/tour docs/assets/qr-web.svg package-lock.json \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          if [ -f docs/assets/tour.hash ] && [ "$(cat docs/assets/tour.hash)" = "$hash" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Tour inputs unchanged; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 🟢 Set up Node.js
        if: steps.hash.outputs.changed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: 📦 Install dependencies
        if: steps.hash.outputs.changed == 'true'
        run: npm ci
      - name: 🏗️ Build
        if: steps.hash.outputs.changed == 'true'
        run: npm run build
      - name: 🎭 Install Playwright Chromium
        if: steps.hash.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium
      - name: 🎞️ Install ffmpeg and WebP tools
        if: steps.hash.outputs.changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg webp
      - name: 🎬 Record clips, check and render the tour into docs/assets
        if: steps.hash.outputs.changed == 'true'
        env:
          HYPERFRAMES_SKIP_SKILLS: '1'
          HYPERFRAMES_NO_UPDATE_CHECK: '1'
        run: npm run tour -- --dist dist --out docs/assets
      - name: 📏 Check the output sizes
        if: steps.hash.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ls -l docs/assets/tour.mp4 docs/assets/tour.webp docs/assets/tour-poster.png
          [ "$(stat -c %s docs/assets/tour.mp4)" -lt 10000000 ]
          [ "$(stat -c %s docs/assets/tour.webp)" -lt 2000000 ]
      - name: 🚀 Open the tour pull request
        id: pr
        if: steps.hash.outputs.changed == 'true'
        env:
          # The default GITHUB_TOKEN cannot trigger the required pull_request checks.
          PR_TOKEN: ${{ secrets.DOCS_SYNC_PR_TOKEN }}
          HASH: ${{ steps.hash.outputs.hash }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$HASH" > docs/assets/tour.hash
          # Defensive: only tour assets may be committed.
          unexpected=$(git status --porcelain | awk '{print $2}' | grep -v '^docs/assets/tour' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected changes outside the tour assets: $unexpected"
            exit 1
          fi
          branch="lights-out/tour-${SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/assets/tour.mp4 docs/assets/tour.webp docs/assets/tour-poster.png docs/assets/tour.hash
          git commit -m "docs: update the README tour video"
          git push "https://x-access-token:${PR_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          url=$(GH_TOKEN="$PR_TOKEN" gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "$PR_TITLE" --label "📝 documentation" --label "🌙 lights-out" \
            --body "Regenerated by the \`🎬 README tour\` workflow after the deploy of ${SHA::7} because the tour inputs changed. It only touches \`docs/assets/tour*\`.")
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
      - name: 🔀 Enable auto-merge (squash) when only docs/ changed
        if: steps.pr.outputs.number != ''
        env:
          PR_TOKEN: ${{ secrets.DOCS_SYNC_PR_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          while IFS= read -r file; do
            case "$file" in
              docs/*) ;;
              *)
                echo "::warning::PR #$PR_NUMBER touches $file outside docs/; auto-merge not enabled."
                exit 0
                ;;
            esac
          done <<< "$files"
          GH_TOKEN="$PR_TOKEN" gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
          echo "✅ Auto-merge enabled on PR #$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"
