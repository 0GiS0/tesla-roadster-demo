name: 🧰 Copilot setup steps
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
permissions:
  contents: read
concurrency:
  group: copilot-setup-steps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The job id must be exactly `copilot-setup-steps` or the Copilot cloud agent ignores this file.
  # It has no `name:` so the check keeps the same name as the id.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    # This limit also covers the agent's own work, not just the setup. 59 is the documented maximum.
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🌐 Install Chromium for Playwright
        # Runs after `npm ci`, so it uses the playwright-core version pinned in package-lock.json.
        run: npx playwright-core install --with-deps chromium
      - name: 🎞️ Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: ✅ Verify tools
        run: |
          set -euo pipefail
          command -v node npm ffmpeg
          ffmpeg -version | head -n 1
          chromium_path=$(node -e "import('playwright-core').then(({ chromium }) => console.log(chromium.executablePath()))")
          test -x "$chromium_path"
          echo "chromium: $chromium_path"
