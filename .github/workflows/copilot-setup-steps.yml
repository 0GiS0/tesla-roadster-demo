name: 🧰 Copilot setup steps
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
permissions:
  contents: read
concurrency:
  group: copilot-setup-steps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The job id must be exactly `copilot-setup-steps` or the Copilot cloud agent ignores this file.
  # It has no `name:` so the check keeps the same name as the id.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    # This limit also covers the agent's own work, not just the setup. 59 is the documented maximum.
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: ⏱️ Make apt fail fast on a slow mirror
        run: |
          printf 'Acquire::http::Timeout "10";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99-fail-fast
      - name: 🌐 Install Chromium for Playwright
        # Runs after `npm ci`, so it uses the playwright-core version pinned in package-lock.json.
        run: npx playwright-core install --with-deps chromium
      - name: 🗃️ Restore ffmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ffmpeg-static/ffmpeg
          key: ffmpeg-static-b6.1.1-linux-x64
      - name: 🎞️ Download ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        # Pinned static build (ffmpeg 7.0.2 with libx264 and libwebp); no apt involved.
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o ffmpeg.gz https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64.gz
          echo "bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa  ffmpeg.gz" | sha256sum -c -
          mkdir -p ~/.cache/ffmpeg-static
          gunzip -c ffmpeg.gz > ~/.cache/ffmpeg-static/ffmpeg
          rm ffmpeg.gz
      - name: 🎞️ Install ffmpeg
        run: sudo install -m 0755 ~/.cache/ffmpeg-static/ffmpeg /usr/local/bin/ffmpeg
      - name: ✅ Verify tools
        run: |
          set -euo pipefail
          command -v node npm ffmpeg
          ffmpeg -version | head -n 1
          chromium_path=$(node -e "import('playwright-core').then(({ chromium }) => console.log(chromium.executablePath()))")
          test -x "$chromium_path"
          echo "chromium: $chromium_path"
