name: 🚀 Validate and deploy Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Pull requests cancel superseded runs. Pushes and manual runs get a unique
# group (run_id), so they are never cancelled; deploys stay serialized by the
# job-level "pages" group below.
concurrency:
  group: ci-pages-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: 🔍 changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: 🔍 Detect changes that affect the app
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          # Fail safe: anything unexpected means the app is considered changed.
          set -uo pipefail
          emit() { echo "app=$1" >> "$GITHUB_OUTPUT"; echo "app=$1 ($2)"; }

          case "$EVENT_NAME" in
            pull_request)
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
                --jq '.[] | .filename, (.previous_filename // empty)') || { emit true "could not list pull request files"; exit 0; }
              ;;
            push)
              if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then emit true "new branch, no base to compare"; exit 0; fi
              # A force-push can leave BEFORE_SHA unreachable or diverged; only a fast-forward is trusted.
              status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE_SHA...$AFTER_SHA?per_page=1" --jq '.status') || { emit true "could not compare commits"; exit 0; }
              if [ "$status" != ahead ]; then emit true "push is not a fast-forward ($status)"; exit 0; fi
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BEFORE_SHA...$AFTER_SHA?per_page=100" \
                --jq '.files[] | .filename, (.previous_filename // empty)') || { emit true "could not compare commits"; exit 0; }
              ;;
            *)
              emit true "manual or unsupported event"; exit 0
              ;;
          esac

          if [ -z "$files" ]; then emit true "empty file list"; exit 0; fi

          # The compare API truncates at 300 files and the pull request files API at 3000.
          limit=3000
          if [ "$EVENT_NAME" = push ]; then limit=300; fi
          if [ "$(wc -l <<< "$files")" -ge "$limit" ]; then emit true "file list may be truncated"; exit 0; fi

          while IFS= read -r file; do
            case "$file" in
              docs/* | *.md | .github/CODEOWNERS | .github/ISSUE_TEMPLATE/*) ;;
              *) emit true "app change: $file"; exit 0 ;;
            esac
          done <<< "$files"
          emit false "only documentation changed"
  validate:
    name: 🧪 validate
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🧹 Lint
        run: npm run lint
      - name: 🔎 Type check
        run: npm run typecheck
      - name: 🧪 Run tests
        run: npm test
      - name: 🚗 Validate GLB model
        run: python3 model/validate_glb.py
      - name: 🏗️ Build
        run: npm run build
      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    name: 🌐 deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
