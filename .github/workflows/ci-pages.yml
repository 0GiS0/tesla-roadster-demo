name: 🚀 Validate and deploy Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    name: 🔍 changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: 🔍 Detect changes that affect the app
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          # Fail safe: anything unexpected means the app is considered changed.
          set -uo pipefail
          emit() { echo "app=$1" >> "$GITHUB_OUTPUT"; echo "app=$1 ($2)"; }

          case "$EVENT_NAME" in
            pull_request)
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
                --jq '.[] | .filename, (.previous_filename // empty)') || { emit true "could not list pull request files"; exit 0; }
              ;;
            push)
              if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then emit true "new branch, no base to compare"; exit 0; fi
              # A force-push can leave BEFORE_SHA unreachable; the API call then fails and validation runs.
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BEFORE_SHA...$AFTER_SHA?per_page=100" \
                --jq '.files[] | .filename, (.previous_filename // empty)') || { emit true "could not compare commits"; exit 0; }
              ;;
            *)
              emit true "manual or unsupported event"; exit 0
              ;;
          esac

          if [ -z "$files" ]; then emit true "empty file list"; exit 0; fi

          # The compare API truncates at 300 files, so a large push is never treated as docs-only.
          if [ "$EVENT_NAME" = push ] && [ "$(wc -l <<< "$files")" -ge 300 ]; then emit true "file list may be truncated"; exit 0; fi

          while IFS= read -r file; do
            case "$file" in
              docs/* | *.md | .github/CODEOWNERS | .github/ISSUE_TEMPLATE/*) ;;
              *) emit true "app change: $file"; exit 0 ;;
            esac
          done <<< "$files"
          emit false "only documentation changed"
  validate:
    name: 🧪 validate
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🧹 Lint
        run: npm run lint
      - name: 🔎 Type check
        run: npm run typecheck
      - name: 🧪 Run tests
        run: npm test
      - name: 🚗 Validate GLB model
        run: python3 model/validate_glb.py
      - name: 🏗️ Build
        run: npm run build
      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    name: 🌐 deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
